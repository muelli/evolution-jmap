[workspace]
resolver = "2"
members = ["crates/*"]
# example-module, eds-sys, evo-sys, jmap-backend-core, jmap-backend-book,
# jmap-backend-cal, jmap-mail, jmap-backend-collection, jmap-config and the
# four `*-module` cdylib crates that hold their C entry points need
# Evolution/EDS/Camel
# development headers (pkg-config probes in eds-sys's and evo-sys's build.rs);
# keep them out of the default set so `cargo test` works on machines without
# them. CI builds `--workspace`, and CMake runs their tests via the
# rust-test-eds target.
#
# jmap-functional is out for a different reason: it needs no headers, but its
# tests drive the EDS *runtime* — evolution-source-registry and
# evolution-addressbook-factory on a private D-Bus session — and are handed
# paths by CTest. Running them is `ctest -L functional` against a build
# configured with -DENABLE_FUNCTIONAL_TESTS=ON; see docs/functional-tests.md.
default-members = [
    "crates/jmap-proto",
    "crates/jmap-client",
    "crates/jmap-mock",
    "crates/jmap-vcard",
    "crates/jmap-ical",
    "crates/jmap-book-sync",
    "crates/jmap-cal-sync",
    "crates/jmap-mail-sync",
    "crates/jmap-collection-sync",
    "crates/po-compile",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
# RFC 3986 percent-coding, for URL-template substitution and OAuth2 form
# bodies. Already in the tree transitively via ureq; listed here to depend on
# it directly instead of hand-rolling the same codec.
percent-encoding = "2"
base64 = "0.22"
tiny_http = "0.12"
# RFC 7636 PKCE code-verifier randomness (jmap-client's OAuth2 token exchange).
getrandom = "0.3"
# RFC 7636 §4.2's S256 challenge (SHA-256); this project does not hand-roll
# hashing.
sha2 = "0.10"
pkg-config = "0.3"
bindgen = "0.72"
# Property-based testing of the untrusted-server boundary (dev-dependency
# only): stable-friendly, unlike cargo-fuzz which needs nightly.
proptest = "1"
# The iCalendar/vCard text layer, from Stalwart's CalDAV/CardDAV stack.
# default-features = false leaves out the JSCalendar/JSContact halves: the
# JMAP side of the mapping is ours and is already tested against the mock.
calcard = { version = "0.3.13", default-features = false }
glib-sys = "0.22"
gobject-sys = "0.22"
gio-sys = "0.22"
# Track B1: journald structured logging (jmap-backend-core::logging).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Writes the journal's native protocol directly (no libsystemd FFI).
tracing-journald = "0.3"
# `jmap-client`'s EventSource reader (item 28): both already in the tree
# transitively via `ureq`'s own TLS backend, depended on directly here for
# the raw-socket `https://` handshake a unary request/response transport
# (ureq itself) cannot do for an indefinite stream.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

eds-sys = { path = "crates/eds-sys" }
evo-sys = { path = "crates/evo-sys" }
evolution-jmap-proto = { path = "crates/jmap-proto" }
evolution-jmap-client = { path = "crates/jmap-client" }
evolution-jmap-mock = { path = "crates/jmap-mock" }
evolution-jmap-vcard = { path = "crates/jmap-vcard" }
evolution-jmap-ical = { path = "crates/jmap-ical" }
evolution-jmap-book-sync = { path = "crates/jmap-book-sync" }
evolution-jmap-cal-sync = { path = "crates/jmap-cal-sync" }
evolution-jmap-mail-sync = { path = "crates/jmap-mail-sync" }
evolution-jmap-collection-sync = { path = "crates/jmap-collection-sync" }
jmap-backend-core = { path = "crates/jmap-backend-core" }
jmap-backend-book = { path = "crates/jmap-backend-book" }
jmap-backend-cal = { path = "crates/jmap-backend-cal" }
jmap-backend-collection = { path = "crates/jmap-backend-collection" }
jmap-config = { path = "crates/jmap-config" }
jmap-mail = { path = "crates/jmap-mail" }
jmap-ui = { path = "crates/jmap-ui" }

# Every unsafe operation inside an `unsafe fn` body needs its own `unsafe {}`
# block and its own SAFETY comment, rather than the whole fn body being an
# implicit unsafe scope. Edition 2024 already warns on this; deny makes it a
# hard error regardless of what flags a given `cargo` invocation passes.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Reproducibility: deterministic codegen, no incremental state, no debug paths.
[profile.release]
codegen-units = 1
strip = "debuginfo"
incremental = false

# Test binaries statically link the full EDS/GTK FFI surface per crate, so
# unstripped they run 100-130MB each; with ~90 of them across the workspace
# that fills a CI runner's disk (rust-lld dies with a Bus error that looks
# like a linker bug but is actually ENOSPC). Debug info is not needed to run
# them, only to debug a failure post-mortem with gdb, so strip it the same
# way [profile.release] already does.
[profile.test]
strip = "debuginfo"
