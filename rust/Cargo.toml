[package]
name = "example-module"
version = "0.0.1"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "GNOME Evolution plugin template written in Rust"

# Build a C-compatible shared library (.so) that Evolution loads as a plugin.
[lib]
name = "example_module"
crate-type = ["cdylib"]

[build-dependencies]
pkg-config = "0.3"
