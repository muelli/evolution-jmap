[workspace]
resolver = "2"
members = ["crates/*"]
# example-module, eds-sys, jmap-backend-core, jmap-backend-book,
# jmap-backend-cal, jmap-mail and jmap-backend-collection need Evolution/EDS/Camel
# development headers (pkg-config probes in eds-sys's build.rs); keep them out
# of the default set so `cargo test` works on machines without them. CI builds
# `--workspace`, and CMake runs their tests via the rust-test-eds target.
default-members = [
    "crates/jmap-proto",
    "crates/jmap-client",
    "crates/jmap-mock",
    "crates/jmap-vcard",
    "crates/jmap-ical",
    "crates/jmap-book-sync",
    "crates/jmap-cal-sync",
    "crates/jmap-mail-sync",
    "crates/jmap-collection-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
base64 = "0.22"
tiny_http = "0.12"
pkg-config = "0.3"
bindgen = "0.72"
glib-sys = "0.22"
gobject-sys = "0.22"
gio-sys = "0.22"

eds-sys = { path = "crates/eds-sys" }
evolution-jmap-proto = { path = "crates/jmap-proto" }
evolution-jmap-client = { path = "crates/jmap-client" }
evolution-jmap-mock = { path = "crates/jmap-mock" }
evolution-jmap-vcard = { path = "crates/jmap-vcard" }
evolution-jmap-ical = { path = "crates/jmap-ical" }
evolution-jmap-book-sync = { path = "crates/jmap-book-sync" }
evolution-jmap-cal-sync = { path = "crates/jmap-cal-sync" }
evolution-jmap-mail-sync = { path = "crates/jmap-mail-sync" }
evolution-jmap-collection-sync = { path = "crates/jmap-collection-sync" }
jmap-backend-core = { path = "crates/jmap-backend-core" }

# Reproducibility: deterministic codegen, no incremental state, no debug paths.
[profile.release]
codegen-units = 1
strip = "debuginfo"
incremental = false
