[package]
name = "evolution-jmap-proto"
description = "JMAP protocol types: RFC 8620 core, RFC 8621 mail, RFC 9610 contacts, JMAP Calendars draft, RFC 9670 principals"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_proto"

[features]
default = ["mail", "contacts", "calendars", "principals"]
mail = []
contacts = []
calendars = []
principals = ["calendars"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
