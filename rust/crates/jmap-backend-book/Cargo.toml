[package]
name = "jmap-backend-book"
description = "The JMAP address book backend for Evolution Data Server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "jmap_backend_book"
# rlib only. What EDS dlopens (installed as libebookbackendjmap.so) is the
# companion `jmap-backend-book-module` crate, which is a cdylib holding
# nothing but the two `#[unsafe(no_mangle)]` entry points and delegating both
# to `module::load`/`module::unload` here. The two cannot drift — the cdylib
# has no behaviour of its own to drift with — and the tests link this rlib and
# call the bodies directly.
crate-type = ["rlib"]

[features]
# Compiler-enforced (not just documented) test-only gate on `detached()`,
# which builds an instance by zeroing memory outside the GObject type system —
# see docs/UNSAFE-AUDIT.md Pattern A. Enabled for this crate's own test builds
# via the self dev-dependency below; never on for a normal build. Reaches
# through to jmap-backend-core's own `testing` gate on `instance::zeroed_box`,
# the shared helper `detached()` is built on.
testing = ["jmap-backend-core/testing"]

[dependencies]
eds-sys = { workspace = true }
jmap-backend-core = { workspace = true }
jmap-config = { workspace = true }
evolution-jmap-book-sync = { workspace = true }
evolution-jmap-client = { workspace = true }
evolution-jmap-proto = { workspace = true }
gio-sys = { workspace = true }
glib-sys = { workspace = true }
gobject-sys = { workspace = true }

[dev-dependencies]
# Self dev-dependency to turn on `testing` (and so `detached()`) for this
# crate's own test builds only — see the `[features]` comment above.
jmap-backend-book = { path = ".", features = ["testing"] }
evolution-jmap-mock = { workspace = true }
# Only to name a VCardError variant when checking the error mapping; the
# backend itself never sees one that jmap-book-sync has not already wrapped.
evolution-jmap-vcard = { workspace = true }
