[package]
name = "eds-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Raw FFI bindings to the Evolution Data Server backend libraries"
publish = false
# Tell cargo we handle the linking ourselves in build.rs, so it does not
# invent `-leds-sys` and does not rerun the build script on every file touch.
links = "evolution-data-server"

[dependencies]
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
gio-sys = { workspace = true }

[dev-dependencies]
# The layout test asserts that our re-exported GLib types *are* the gtk-rs
# ones, which only means anything if it can name both spellings.
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
gio-sys = { workspace = true }

[build-dependencies]
bindgen = { workspace = true }
pkg-config = { workspace = true }
