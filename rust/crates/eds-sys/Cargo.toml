[package]
name = "eds-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Raw FFI bindings to the Evolution Data Server backend libraries"
publish = false
# Declare the native library that build.rs links. Cargo gives the build-script
# metadata to dependents as `DEP_EVOLUTION_DATA_SERVER_<KEY>`.
links = "evolution-data-server"

[lints]
workspace = true

[dependencies]
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
gio-sys = { workspace = true }

[dev-dependencies]
# The layout test asserts that the re-exported GLib types are the gtk-rs types.
# For this, it must name both spellings.
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
gio-sys = { workspace = true }

[build-dependencies]
bindgen = { workspace = true }
pkg-config = { workspace = true }
