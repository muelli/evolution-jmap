[package]
name = "jmap-mail"
description = "The JMAP Camel provider for Evolution"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "jmap_mail"
# cdylib is what Camel dlopens (installed as libcameljmap.so); rlib is what
# the integration tests link against, and building both keeps the two from
# drifting apart.
crate-type = ["cdylib", "rlib"]

[features]
# Compiler-enforced (not just documented) test-only gate on `detached()`
# (`store.rs`/`transport.rs`), which builds an instance by zeroing memory
# outside the GObject type system — see docs/UNSAFE-AUDIT.md Pattern A.
# Enabled for this crate's own test builds via the self dev-dependency below;
# never on for a normal build. Reaches through to jmap-backend-core's own
# `testing` gate on `instance::zeroed_box`, the shared helper `detached()` is
# built on.
testing = ["jmap-backend-core/testing"]

[dependencies]
eds-sys = { workspace = true }
jmap-backend-core = { workspace = true }
evolution-jmap-mail-sync = { workspace = true }
evolution-jmap-client = { workspace = true }
evolution-jmap-proto = { workspace = true }
gio-sys = { workspace = true }
glib-sys = { workspace = true }
gobject-sys = { workspace = true }

[dev-dependencies]
# Self dev-dependency to turn on `testing` (and so `detached()`) for this
# crate's own test builds only — see the `[features]` comment above.
jmap-mail = { path = ".", features = ["testing"] }
# The connect tests need a server to open an account against.
evolution-jmap-mock = { workspace = true }
