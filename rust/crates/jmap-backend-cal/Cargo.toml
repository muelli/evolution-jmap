[package]
name = "jmap-backend-cal"
description = "The JMAP calendar backend for Evolution Data Server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_backend_cal"
# rlib only. The companion cdylib `jmap-backend-cal-module` exports the C entry points.
crate-type = ["rlib"]

[features]
# Test-only gate on `detached()`, which builds an instance outside the GObject type system.
testing = ["jmap-backend-core/testing"]

[dependencies]
eds-sys = { workspace = true }
jmap-backend-core = { workspace = true }
jmap-config = { workspace = true }
evolution-jmap-cal-sync = { workspace = true }
evolution-jmap-client = { workspace = true }
evolution-jmap-proto = { workspace = true }
gio-sys = { workspace = true }
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# For mallinfo2 heap accounting in tests/references.rs.
libc = "0.2.189"
# Self dev-dependency to enable `testing` for crate test targets.
jmap-backend-cal = { path = ".", features = ["testing"] }
evolution-jmap-mock = { workspace = true }
# Error variant inspection and timezone resolution test assertions.
evolution-jmap-ical = { workspace = true }
# JSON test values for timeZones definitions.
serde_json = { workspace = true }
