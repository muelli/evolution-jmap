[package]
name = "jmap-ui"
description = "JMAP-only features in Evolution's UI: vacation, scheduled send, snooze, undo of a delete"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_ui"
# rlib only, for the same reason as jmap-config. Evolution dlopens the shared
# object of the companion `jmap-config-module` cdylib. Its `e_module_load`
# calls `module::load` of this crate and `jmap_config::module::load`.
# One module is one .so, as in EWS. Thus the module-wide SessionCache is one
# cache for all extensions in that .so.
crate-type = ["rlib"]

[dependencies]
eds-sys = { workspace = true }
# The Evolution side: the notebook that the vacation extension extends, and
# the page interface that it implements. All EDS/GLib types in evo-sys are
# the eds-sys types, through the re-export of that crate.
evo-sys = { workspace = true }
evolution-jmap-client = { workspace = true }
# The undo window of a collection delete, and its due time on the source.
evolution-jmap-collection-sync = { workspace = true }
# The identity that covers a sender address, as Send selects it.
evolution-jmap-mail-sync = { workspace = true }
evolution-jmap-proto = { workspace = true }
# GTask (the async submit pair) and GCancellable.
gio-sys = { workspace = true }
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
jmap-backend-core = { workspace = true }
jmap-config = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Turns on core's `testing` for the test builds only: `tests/undo_delete.rs`
# makes its `ESource` with `OwnedSource`.
jmap-backend-core = { workspace = true, features = ["testing"] }
# `tests/send_later.rs` tests the full scheduled-send exchange against the
# stateful mock, including the HOLDFOR gate.
evolution-jmap-mock = { workspace = true }
