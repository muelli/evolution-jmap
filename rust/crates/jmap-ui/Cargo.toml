[package]
name = "jmap-ui"
description = "JMAP-only features in Evolution's UI: vacation, scheduled send, snooze"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_ui"
# rlib only, on jmap-config's argument: the shared object Evolution dlopens is
# the companion `jmap-config-module` cdylib, whose `e_module_load` calls this
# crate's `module::load` beside `jmap_config::module::load`. One module, one
# .so — the EWS precedent — and the per-account SessionCache is shared by
# every extension registered out of it.
crate-type = ["rlib"]

[dependencies]
eds-sys = { workspace = true }
# The Evolution side: the notebook the vacation extension extends and the
# page interface it implements. Every EDS/GLib type comes back out of eds-sys,
# per that crate's re-export.
evo-sys = { workspace = true }
evolution-jmap-client = { workspace = true }
evolution-jmap-proto = { workspace = true }
# GTask (the async submit pair) and GCancellable.
gio-sys = { workspace = true }
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
jmap-backend-core = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
