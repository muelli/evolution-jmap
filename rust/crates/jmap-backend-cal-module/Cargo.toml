[package]
name = "jmap-backend-cal-module"
description = "libecalbackendjmap.so: the calendar backend's module entry points"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_backend_cal_module"
# cdylib exporting C module entry points.
crate-type = ["cdylib"]

[dependencies]
jmap-backend-cal = { workspace = true }
gobject-sys = { workspace = true }
# Metadata-only dependency so Cargo exposes DEP_EVOLUTION_SHELL_LIBDIRS to build.rs.
evo-sys = { workspace = true }
