[package]
name = "evolution-jmap-vcard"
description = "JSContact (RFC 9553) to vCard 3.0 mapping for the Evolution address book backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_vcard"

[dependencies]
# Photo bytes use base64 in both formats.
# JSContact uses a `data:` URI payload.
# vCard uses an `ENCODING=b` value.
base64 = { workspace = true }
calcard = { workspace = true }
evolution-jmap-proto = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The tests also use values from the mock server.
# This check complements checked-in fixtures.
evolution-jmap-client = { workspace = true }
evolution-jmap-mock = { workspace = true }
proptest = "1"
