[package]
name = "evolution-jmap-vcard"
description = "JSContact (RFC 9553) to vCard 3.0 mapping for the Evolution address book backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "jmap_vcard"

[dependencies]
# A photo crosses as base64 on the wire in both formats — a `data:` URI's
# payload on the JSContact side, an `ENCODING=b` value on the vCard side.
base64 = { workspace = true }
calcard = { workspace = true }
evolution-jmap-proto = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The mapping is also exercised against what the mock server really returns,
# not only against checked-in fixtures.
evolution-jmap-client = { workspace = true }
evolution-jmap-mock = { workspace = true }
proptest = "1"
