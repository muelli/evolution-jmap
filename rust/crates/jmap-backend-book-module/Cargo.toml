[package]
name = "jmap-backend-book-module"
description = "libebookbackendjmap.so: the address book backend's module entry points"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_backend_book_module"
# cdylib and nothing else, which is the point of the crate. See src/lib.rs.
crate-type = ["cdylib"]

[dependencies]
jmap-backend-book = { workspace = true }
gobject-sys = { workspace = true }
# Metadata-only, for this crate's own build.rs: not called from any Rust code
# here, but needs to be a direct (non-build) dependency for Cargo to set
# `DEP_EVOLUTION_SHELL_LIBDIRS` from its `links` key. See build.rs.
evo-sys = { workspace = true }
