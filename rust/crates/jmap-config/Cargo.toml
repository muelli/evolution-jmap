[package]
name = "jmap-config"
description = "The JMAP account setup module for Evolution"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "jmap_config"
# An rlib only, so far. The cdylib Evolution dlopens as
# module-jmap-configuration.so comes with the module entry point; a cdylib with
# no entry point would install a file no host ever opens.

[dependencies]
eds-sys = { workspace = true }
jmap-backend-core = { workspace = true }
evolution-jmap-collection-sync = { workspace = true }
glib-sys = { workspace = true }

[dev-dependencies]
# The account this writes is only right if the collection backend reads it back
# as the account that was written, so the tests link the reader and hold the two
# against each other.
jmap-backend-collection = { workspace = true }
gobject-sys = { workspace = true }
