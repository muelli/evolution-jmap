[package]
name = "jmap-config"
description = "The JMAP account setup module for Evolution"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_config"
# rlib only. Evolution dlopens the companion `jmap-config-module` crate
# (installed as module-jmap-configuration.so). That crate is a cdylib that
# holds only the two `#[unsafe(no_mangle)]` entry points, which call
# `module::load`/`module::unload` here. The dev-dependency on
# `jmap-backend-collection` below made the split necessary: both rlibs defined
# `e_module_load`, and in one link the two became one.
crate-type = ["rlib"]

[features]
# A test-only gate on `detached()` that the compiler enforces (not only the
# docs). `detached()` builds an instance from zeroed memory, outside the
# GObject type system. The self dev-dependency below enables it for the test
# builds of this crate. A normal build never enables it. It also enables the
# `testing` gate of jmap-backend-core on `instance::zeroed_box`, the shared
# helper that `detached()` uses.
testing = ["jmap-backend-core/testing"]

[dependencies]
eds-sys = { workspace = true }
# The Evolution side of the ABI: the classes that this crate subclasses. Each
# EDS and GLib type in it comes from `eds-sys` above, so an `ESource` from a
# vfunc is the same Rust type that the writers here accept.
evo-sys = { workspace = true }
jmap-backend-core = { workspace = true }
evolution-jmap-collection-sync = { workspace = true }
# The discovery and registration calls of `oauth2_setup`: the RFC 8414/7591
# client that `jmap_backend_collection` also links. It is the only part of this
# crate that uses the network directly, not through an `ESource`.
evolution-jmap-client = { workspace = true }
glib-sys = { workspace = true }
# The `GCancellable` argument of `EConfigLookupWorker::run`, connected to a
# `CancelFlag` through `jmap_backend_core::cancel::CancelBridge`.
gio-sys = { workspace = true }
# For the `GTypeModule` that the module entry point registers the classes
# against, and for the GObject calls (properties, bindings, signals, values,
# references) that the subclass helpers of `jmap-backend-core` do not supply.
gobject-sys = { workspace = true }
tracing = { workspace = true }
# `oauth2_service` stores PKCE verifiers between the two halves of a consent
# flow. It erases them when they are replaced, redeemed or evicted.
zeroize = { workspace = true }

[dev-dependencies]
# Self dev-dependency that enables `testing` (and thus `detached()`) only for
# the test builds of this crate. See the `[features]` comment above.
jmap-config = { path = ".", features = ["testing"] }
# The PKCE round-trip test calculates BASE64URL(SHA256(verifier)) again, to
# compare the verifier of the token form with the challenge of the
# authorization query. The PKCE type of jmap-client uses the same two crates,
# so the lockfile does not change.
base64 = { workspace = true }
sha2 = { workspace = true }
# The account that this crate writes is correct only if the collection backend
# reads it back as the same account. Thus the tests link the reader and compare
# the two.
jmap-backend-collection = { workspace = true }
# Also, the mail sources are correct only if the Camel provider connects to the
# server that they name. This is deliberately a dev-dependency, not a
# dependency. The library writes `ESource` groups. The tests need the provider
# only for the `CamelJmapSettings` GType, from which an `ESourceCamel` subtype
# is generated. That GType reads the output of this crate. It is not part of
# this crate.
jmap-mail = { workspace = true }
# The tests of `oauth2_setup` run discovery and registration against a served
# deployment, not against a transport mocked by hand.
evolution-jmap-mock = { workspace = true }
evolution-jmap-tracing-capture = { workspace = true }
serde_json = { workspace = true }
