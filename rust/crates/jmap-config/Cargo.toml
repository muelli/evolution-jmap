[package]
name = "jmap-config"
description = "The JMAP account setup module for Evolution"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "jmap_config"
# rlib only. What Evolution dlopens (installed as
# module-jmap-configuration.so) is the companion `jmap-config-module` crate,
# which is a cdylib holding nothing but the two `#[unsafe(no_mangle)]` entry
# points and delegating both to `module::load`/`module::unload` here. The
# dev-dependency on `jmap-backend-collection` below is what forced the split:
# both rlibs used to define `e_module_load`, and in one link they became one.
crate-type = ["rlib"]

[features]
# Compiler-enforced (not just documented) test-only gate on `detached()`,
# which builds an instance by zeroing memory outside the GObject type system —
# see docs/UNSAFE-AUDIT.md Pattern A. Enabled for this crate's own test builds
# via the self dev-dependency below; never on for a normal build. Reaches
# through to jmap-backend-core's own `testing` gate on `instance::zeroed_box`,
# the shared helper `detached()` is built on.
testing = ["jmap-backend-core/testing"]

[dependencies]
eds-sys = { workspace = true }
# The Evolution side of the ABI: the one class `backend` subclasses. Every EDS
# and GLib type it mentions comes back out of `eds-sys` above, so an `ESource`
# handed over by a vfunc is the same Rust type the writers here take.
evo-sys = { workspace = true }
jmap-backend-core = { workspace = true }
evolution-jmap-collection-sync = { workspace = true }
# `oauth2_setup`'s discovery and registration calls: the RFC 8414/7591 client
# `jmap_backend_collection` also links, and the only piece of this crate that
# talks to the network directly rather than through an `ESource`.
evolution-jmap-client = { workspace = true }
glib-sys = { workspace = true }
# `EConfigLookupWorker::run`'s `GCancellable` argument, bridged onto a
# `CancelFlag` via `jmap_backend_core::cancel::CancelBridge`.
gio-sys = { workspace = true }
# For the `GTypeModule` the module entry point registers the class against, and
# nothing else: every other GObject call this crate makes is behind
# `jmap-backend-core`'s subclass helpers.
gobject-sys = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Self dev-dependency to turn on `testing` (and so `detached()`) for this
# crate's own test builds only — see the `[features]` comment above.
jmap-config = { path = ".", features = ["testing"] }
# The PKCE round-trip test recomputes BASE64URL(SHA256(verifier)) to hold the
# token form's verifier against the authorization query's challenge — the same
# two crates jmap-client's own PKCE type uses, so nothing new in the lockfile.
base64 = { workspace = true }
sha2 = { workspace = true }
# The account this writes is only right if the collection backend reads it back
# as the account that was written, so the tests link the reader and hold the two
# against each other.
jmap-backend-collection = { workspace = true }
# And the mail sources are only right if the Camel provider connects to the
# server they name. A dev-dependency and deliberately not a dependency: what
# the library writes is `ESource` groups, and the only thing the provider is
# needed for is the `CamelJmapSettings` GType an `ESourceCamel` subtype is
# generated from — which is a reader of this crate's output, not a part of it.
jmap-mail = { workspace = true }
# `oauth2_setup`'s tests drive discovery and registration against a served
# deployment rather than mocking the transport by hand.
evolution-jmap-mock = { workspace = true }
serde_json = { workspace = true }
