[package]
name = "jmap-backend-core"
description = "Shared GObject/EDS glue for the JMAP address book, calendar and mail backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_backend_core"

[features]
# Compiler-enforced (not just documented) test-only gate on `instance::
# zeroed_box`, which builds a value by zeroing memory outside the type it
# claims to be — see docs/UNSAFE-AUDIT.md Pattern A. Each of the five
# consumer crates' own `testing` feature reaches through to this one, so
# enabling theirs (already wired for their own test builds) unlocks this too.
testing = []

[dependencies]
eds-sys = { workspace = true }
evolution-jmap-client = { workspace = true }
evolution-jmap-proto = { workspace = true }
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
gio-sys = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-journald = { workspace = true }

[dev-dependencies]
libc = "0.2.189"
# `push`'s pump is tested against a real EventSource connection, which needs
# a real server; the mock needs no EDS headers of its own.
evolution-jmap-mock = { workspace = true }

