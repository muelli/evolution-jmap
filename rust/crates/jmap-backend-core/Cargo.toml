[package]
name = "jmap-backend-core"
description = "Shared GObject/EDS glue for the JMAP address book, calendar and mail backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_backend_core"

[features]
# Compiler-enforced (not only documented) test-only gate on `instance::
# zeroed_box`. It makes a value from zeroed memory, outside the type that it
# claims to be. The `testing` feature of each of the five consumer crates
# enables this one. Their test builds already enable their own `testing`, so
# they also enable this one.
testing = []

[dependencies]
eds-sys = { workspace = true }
evolution-jmap-client = { workspace = true }
evolution-jmap-proto = { workspace = true }
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
gio-sys = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-journald = { workspace = true }

[dev-dependencies]
libc = "0.2.189"
# The tests for `push`'s pump use a real EventSource connection, which needs
# a real server. The mock needs no EDS headers of its own.
evolution-jmap-mock = { workspace = true }
evolution-jmap-tracing-capture = { workspace = true }
# Self dev-dependency that enables `testing` (and thus `instance::zeroed_box`)
# only for this crate's own test builds. The five consumer crates use the
# same method to enable this feature from their own.
jmap-backend-core = { path = ".", features = ["testing"] }

