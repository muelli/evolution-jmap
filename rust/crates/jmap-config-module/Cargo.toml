[package]
name = "jmap-config-module"
description = "module-jmap-configuration.so: the account setup module's entry points"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_config_module"
# Only a cdylib, which is the purpose of the crate. See src/lib.rs.
crate-type = ["cdylib"]

[dependencies]
jmap-config = { workspace = true }
# The UI features (vacation page, scheduled send, snooze) are in the same
# module: e_module_load calls the load of both crates. See jmap_ui::module.
jmap-ui = { workspace = true }
gobject-sys = { workspace = true }
# Only for its metadata, for the build.rs of this crate. No Rust code here
# calls it. It must be a direct, non-build dependency, so that Cargo sets
# `DEP_EVOLUTION_SHELL_LIBDIRS` from its `links` key. See build.rs.
evo-sys = { workspace = true }
