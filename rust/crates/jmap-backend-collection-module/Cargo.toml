[package]
name = "jmap-backend-collection-module"
description = "module-jmap-backend.so: the collection backend's module entry points"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_backend_collection_module"
# cdylib only, and that is the purpose of this crate. Every module in this
# repository must export the fixed name `e_module_load`. A symbol that is only
# in a shared object cannot collide with the copy of another module in a static
# link. Refer to src/lib.rs.
crate-type = ["cdylib"]

[dependencies]
jmap-backend-collection = { workspace = true }
gobject-sys = { workspace = true }
# Metadata only, for build.rs. No Rust code here calls it. Cargo sets
# `DEP_EVOLUTION_SHELL_LIBDIRS` from its `links` key only for a direct
# (non-build) dependency. Refer to build.rs.
evo-sys = { workspace = true }
