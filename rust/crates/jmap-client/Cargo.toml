[package]
name = "evolution-jmap-client"
description = "Blocking JMAP client for the Evolution JMAP plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "jmap_client"

[features]
default = ["transport-ureq"]
transport-ureq = ["dep:ureq"]

[dependencies]
evolution-jmap-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true, optional = true }
base64 = { workspace = true }

[dev-dependencies]
evolution-jmap-mock = { workspace = true }
