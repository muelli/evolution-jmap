[package]
name = "evolution-jmap-client"
description = "Blocking JMAP client for the Evolution JMAP plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_client"

[features]
default = ["transport-ureq"]
transport-ureq = ["dep:ureq"]
# Gates tests/live_server.rs: opt-in integration tests against a real JMAP
# deployment, never run by default or in CI. See docs/manual-test-live-server.md.
live-server = []

[dependencies]
evolution-jmap-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true, optional = true }
percent-encoding = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
evolution-jmap-mock = { workspace = true }
evolution-jmap-ical = { workspace = true }
proptest = { workspace = true }
tiny_http = { workspace = true }

[[test]]
name = "live_server"
path = "tests/live_server.rs"
required-features = ["live-server"]
