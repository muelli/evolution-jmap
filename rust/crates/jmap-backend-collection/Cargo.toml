[package]
name = "jmap-backend-collection"
description = "The JMAP collection backend for evolution-source-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "jmap_backend_collection"
# rlib only. What evolution-source-registry dlopens (installed as
# module-jmap-backend.so) is the companion `jmap-backend-collection-module`
# crate, which is a cdylib holding nothing but the two
# `#[unsafe(no_mangle)]` entry points and delegating both to
# `module::load`/`module::unload` here. This crate is why the split exists:
# `jmap-config` dev-depends on it, and two rlibs that both defined
# `e_module_load` collapsed into one entry point answering for both.
crate-type = ["rlib"]

[dependencies]
eds-sys = { workspace = true }
jmap-backend-core = { workspace = true }
evolution-jmap-client = { workspace = true }
evolution-jmap-collection-sync = { workspace = true }
gio-sys = { workspace = true }
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
# The `EOAuth2Service` implementation the module load registers alongside the
# backend and its factory — see module.rs. `jmap-config` dev-depends on this
# crate for its own account/collection round-trip tests, which is a
# dev-dependency back-edge and not a cycle: nothing this crate's *library*
# needs depends on `jmap-config`'s tests.
jmap-config = { workspace = true }

[dev-dependencies]
evolution-jmap-mock = { workspace = true }
evolution-jmap-proto = { workspace = true }
# What the mail sources this backend writes on are read by. A dev-dependency
# and deliberately not a dependency, for the reason `jmap-config` gives for the
# same line: what the library writes is `ESource` groups, and the provider is
# needed only for the `CamelJmapSettings` GType an `ESourceCamel` subtype is
# generated from — the one object that can be asked the question a store asks.
jmap-mail = { workspace = true }
