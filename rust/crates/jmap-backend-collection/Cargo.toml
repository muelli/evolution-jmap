[package]
name = "jmap-backend-collection"
description = "The JMAP collection backend for evolution-source-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "jmap_backend_collection"
# rlib only. evolution-source-registry loads the companion cdylib
# `jmap-backend-collection-module` (installed as module-jmap-backend.so).
# That cdylib holds only the two `#[unsafe(no_mangle)]` entry points, and
# they call `module::load` and `module::unload` here. `jmap-config`
# dev-depends on this crate. If two rlibs define `e_module_load`, one test
# binary gets one entry point for both crates.
crate-type = ["rlib"]

[features]
# The compiler limits `detached()` to tests. `detached()` makes an instance
# from zeroed memory, outside the GObject type system. The self
# dev-dependency below enables this feature for the tests of this crate only.
# A normal build never enables it. It also enables the `testing` feature of
# jmap-backend-core, which gates `instance::zeroed_box`, the helper that
# `detached()` uses.
testing = ["jmap-backend-core/testing"]

[dependencies]
eds-sys = { workspace = true }
jmap-backend-core = { workspace = true }
evolution-jmap-client = { workspace = true }
evolution-jmap-collection-sync = { workspace = true }
gio-sys = { workspace = true }
glib-sys = { workspace = true }
gobject-sys = { workspace = true }
# Facade only, with no `tracing-subscriber` or `tracing-journald`. A crate
# that does not set up logging needs only the facade, as in
# `evolution-jmap-client`.
tracing = { workspace = true }
# Gives the `EOAuth2Service` implementation that the module load registers
# with the backend and its factory (see module.rs). `jmap-config`
# dev-depends on this crate for its round-trip tests. That is not a cycle,
# because the library of this crate does not need the tests of `jmap-config`.
jmap-config = { workspace = true }

[dev-dependencies]
# Self dev-dependency. It enables `testing` (and thus `detached()`) for the
# tests of this crate only. Refer to the `[features]` comment above.
jmap-backend-collection = { path = ".", features = ["testing"] }
evolution-jmap-mock = { workspace = true }
evolution-jmap-proto = { workspace = true }
serde_json = { workspace = true }
evolution-jmap-tracing-capture = { workspace = true }
# The Camel provider that reads the mail sources this backend writes. It is
# deliberately a dev-dependency, as in `jmap-config`. The library writes
# `ESource` groups. The tests need the provider only for the
# `CamelJmapSettings` GType, from which an `ESourceCamel` subtype is generated.
# Only that object reads the settings as a store does.
jmap-mail = { workspace = true }
