[package]
name = "jmap-backend-collection"
description = "The JMAP collection backend for evolution-source-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "jmap_backend_collection"
# cdylib is what evolution-source-registry dlopens (installed as
# module-jmap-backend.so); rlib is what the integration tests link against, and
# building both keeps the two from drifting apart.
crate-type = ["cdylib", "rlib"]

[dependencies]
eds-sys = { workspace = true }
jmap-backend-core = { workspace = true }
evolution-jmap-client = { workspace = true }
evolution-jmap-collection-sync = { workspace = true }
gio-sys = { workspace = true }
glib-sys = { workspace = true }
gobject-sys = { workspace = true }

[dev-dependencies]
evolution-jmap-mock = { workspace = true }
evolution-jmap-proto = { workspace = true }
