#
# Thin wrapper around the ci/ scripts — the actual logic lives there and
# is shared verbatim with .gitlab-ci.yml, the runner VM, and local runs,
# so the platforms cannot drift. Public repo: GitHub-hosted runners are
# free and unlimited, so everything runs here (no self-hosted runner in
# the pipeline — a public repo plus a self-hosted runner would let a fork
# PR run code on the VM that holds the agent's credentials).

name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "docs/**", "LICENSES/**", "REUSE.toml"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSES/**", "REUSE.toml"]
  workflow_dispatch:

# A newer push to the same ref cancels the older run (collapses the
# autonomous agent's commit bursts into one build).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          workspaces: rust
      - run: ci/checks.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ci/install-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          workspaces: rust
      - run: ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rust-artifacts
          path: |
            build/cargo-target/release/jmap-mockd
            build/cargo-target/release/*.so
          if-no-files-found: error

  reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ci/reproducible.sh

  # M9 layer 1 (docs/functional-tests.md): real EDS daemons against
  # jmap-mockd. Needs evolution-data-server + dbus-daemon, not just the dev
  # headers `build` installs, so it is its own job rather than a step there.
  # Gated (workflow_dispatch, or a PR labelled run-functional-tests) rather
  # than run on every push: slower than the rest of the suite and exercises
  # a layer (EDS's own runtime) the other jobs do not touch.
  functional:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-functional-tests')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ci/install-deps.sh
      - run: ci/install-deps-functional.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: functional
          workspaces: rust
      - run: ci/functional.sh
