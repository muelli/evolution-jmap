#
# Thin wrapper around the ci/ scripts — the actual logic lives there and
# is shared verbatim with .gitlab-ci.yml, the runner VM, and local runs,
# so the platforms cannot drift. Public repo: GitHub-hosted runners are
# free and unlimited, so everything runs here (no self-hosted runner in
# the pipeline — a public repo plus a self-hosted runner would let a fork
# PR run code on the VM that holds the agent's credentials).

name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "docs/**", "LICENSES/**", "REUSE.toml"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSES/**", "REUSE.toml"]
  workflow_dispatch:

# A newer push to the same ref cancels the older run (collapses the
# autonomous agent's commit bursts into one build).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          workspaces: rust
      - run: ci/checks.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ci/install-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          workspaces: rust
      - run: ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rust-artifacts
          path: |
            build/cargo-target/release/jmap-mockd
            build/cargo-target/release/*.so
          if-no-files-found: error

  reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ci/reproducible.sh

  # M9 layer 1 (docs/functional-tests.md): real EDS daemons against
  # jmap-mockd. Needs evolution-data-server + dbus-daemon, not just the dev
  # headers `build` installs, so it is its own job rather than a step there.
  # Gated (workflow_dispatch, or a PR labelled run-functional-tests) rather
  # than run on every push: slower than the rest of the suite and exercises
  # a layer (EDS's own runtime) the other jobs do not touch.
  functional:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-functional-tests')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ci/install-deps.sh
      - run: ci/install-deps-functional.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: functional
          workspaces: rust
      - run: ci/functional.sh

  # M9 Tier 2 (docs/gui-smoke-test.md): a real Evolution under Xvfb against
  # jmap-mockd, driven via AT-SPI. Needs the full `evolution` package plus a
  # virtual X server, not just the EDS runtime `functional` installs, so it
  # is its own job. Gated the same way and for the same reason: slower than
  # the rest of the suite, and worth spending deliberately.
  gui-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-gui-smoke-test')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ci/install-deps.sh
      - run: ci/install-deps-gui-smoke.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui-smoke
          workspaces: rust
      - run: cmake -S . -B build -G Ninja
      - run: cmake --build build
      - run: sudo cmake --install build --component camel-provider
      - run: ci/gui-smoke.sh
        env:
          JMAP_MOCKD: ${{ github.workspace }}/build/cargo-target/release/jmap-mockd
          GUI_SMOKE_ARTIFACTS: ${{ runner.temp }}/gui-smoke-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gui-smoke-artifacts
          path: ${{ runner.temp }}/gui-smoke-artifacts
          if-no-files-found: ignore

  # Item 74's live-Evolution caveat (docs/gui-smoke-test.md): the packaged
  # example-module's merged menu items actually appearing in a real
  # Evolution session, not just linking cleanly. Its own small script beside
  # gui-smoke.sh, same discipline the doc asks for: a different assertion,
  # no shared state. Needs a plain `cmake --install build` with no
  # --component filter, since example-module's install rule carries no
  # COMPONENT of its own (src/CMakeLists.txt) and camel-provider alone would
  # leave the module where Evolution never scans for it.
  gui-smoke-example-module:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-gui-smoke-test')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ci/install-deps.sh
      - run: ci/install-deps-gui-smoke.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui-smoke
          workspaces: rust
      - run: cmake -S . -B build -G Ninja
      - run: cmake --build build
      - run: sudo cmake --install build
      - run: ci/gui-smoke-example-module.sh
        env:
          JMAP_MOCKD: ${{ github.workspace }}/build/cargo-target/release/jmap-mockd
          GUI_SMOKE_ARTIFACTS: ${{ runner.temp }}/gui-smoke-example-module-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gui-smoke-example-module-artifacts
          path: ${{ runner.temp }}/gui-smoke-example-module-artifacts
          if-no-files-found: ignore

  # Item 74's other live-Evolution caveat: the mail-folder-popup half of the
  # same merge, which Evolution only builds on demand when a folder's context
  # menu is actually triggered, so (unlike the sibling job above) this drives
  # a real right-click through AT-SPI rather than reading the tree statically.
  # Same install recipe as gui-smoke-example-module; see
  # ci/gui-smoke-example-module-folder-popup-assert.py for why that needs a
  # window manager and D-Bus activation environment the other two jobs don't.
  gui-smoke-example-module-folder-popup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-gui-smoke-test')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ci/install-deps.sh
      - run: ci/install-deps-gui-smoke.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui-smoke
          workspaces: rust
      - run: cmake -S . -B build -G Ninja
      - run: cmake --build build
      - run: sudo cmake --install build
      - run: ci/gui-smoke-example-module-folder-popup.sh
        env:
          JMAP_MOCKD: ${{ github.workspace }}/build/cargo-target/release/jmap-mockd
          GUI_SMOKE_ARTIFACTS: ${{ runner.temp }}/gui-smoke-example-module-folder-popup-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gui-smoke-example-module-folder-popup-artifacts
          path: ${{ runner.temp }}/gui-smoke-example-module-folder-popup-artifacts
          if-no-files-found: ignore

  # Item 66's live-Evolution caveat: a brand-new JMAP collection account's
  # first populate must authenticate once, not twice. Same install recipe as
  # gui-smoke-example-module; see docs/gui-smoke-test.md's "item 66's
  # live-Evolution populate-once caveat" section and
  # ci/gui-smoke-collection-populate-once-assert.py for why the oracle is
  # jmap-mock's own request log rather than another AT-SPI read.
  gui-smoke-collection-populate-once:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-gui-smoke-test')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ci/install-deps.sh
      - run: ci/install-deps-gui-smoke.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui-smoke
          workspaces: rust
      - run: cmake -S . -B build -G Ninja
      - run: cmake --build build
      - run: sudo cmake --install build
      - run: ci/gui-smoke-collection-populate-once.sh
        env:
          JMAP_MOCKD: ${{ github.workspace }}/build/cargo-target/release/jmap-mockd
          GUI_SMOKE_ARTIFACTS: ${{ runner.temp }}/gui-smoke-collection-populate-once-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gui-smoke-collection-populate-once-artifacts
          path: ${{ runner.temp }}/gui-smoke-collection-populate-once-artifacts
          if-no-files-found: ignore

  # M10 (docs/eds-version-matrix.md): the pinned-3.52 leg is the `build`
  # job above (ctest there already runs rust-test-eds, layout checks
  # included, against the Ubuntu 24.04 headers ci/install-deps.sh pins).
  # This job is the *other* leg: a newer EDS, so an ABI/API drift becomes a
  # red check here instead of a silent runtime segfault later. Fedora's
  # current stable covers both "current stable" and "3.56+" in one
  # container (see the doc for the version this digest resolved to when
  # last checked). continue-on-error: known incompatibilities exist today
  # (documented) and porting the backends to support them is explicitly
  # out of M10's scope — this job's only job is to keep the breakage on
  # the record, not to block CI on a milestone this repository does not
  # commit to. Gated like functional/gui-smoke: it is not part of the
  # every-push signal.
  eds-version-matrix:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-eds-version-matrix')
    runs-on: ubuntu-24.04
    container: docker.io/library/fedora@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    continue-on-error: true
    steps:
      - run: dnf -y install git evolution-data-server-devel evolution-devel pkgconf-pkg-config gcc clang-devel
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: eds-version-matrix
          workspaces: rust
      - run: ci/eds-matrix.sh
