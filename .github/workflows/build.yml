name: Build Evolution Plugin (Rust)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Evolution development packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libcamel1.2-dev \
            libedataserver1.2-dev \
            libebackend1.2-dev \
            libecal2.0-dev \
            evolution-dev

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        working-directory: rust
        run: cargo build --release

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-module
          # Evolution expects the file to be named without the "lib" prefix;
          # rename it here so consumers can drop it straight into the modules dir.
          path: rust/target/release/libexample_module.so
          if-no-files-found: error
