#
# Builds the shared CI image and pushes it to ghcr.io. After a successful
# run, copy the printed digest into release.yml's pin and CI_IMAGE_REPO's
# consumer, cmake/tests/check-release-workflow.cmake (the release job
# references the image by digest, never by tag).
#
# The package name is ci-image, not ci: the original ci package was
# orphaned when the repository was re-created in the 2026-09 split and
# grants this repository no access, in either direction.

name: CI image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Containerfile.ci
      - .github/workflows/ci-image.yml
  schedule:
    # Weekly rebuild pulls in Ubuntu security updates; bump the digest pin
    # in a reviewed commit afterwards.
    - cron: "17 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: docker build -f Containerfile.ci -t "ghcr.io/${{ github.repository }}/ci-image:latest" .

      - name: Push image and record digest
        run: |
          docker push "ghcr.io/${{ github.repository }}/ci-image:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/${{ github.repository }}/ci-image:latest")
          echo "Pushed: ${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Update the digest pin in .github/workflows/release.yml and cmake/tests/check-release-workflow.cmake." >> "$GITHUB_STEP_SUMMARY"
