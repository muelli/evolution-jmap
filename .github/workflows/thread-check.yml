#
# Weekly run of the tests under ThreadSanitizer. The thread-check job runs
# the pure-Rust crates with ci/thread-check.sh. The thread-check-eds job runs
# the FFI crates with ci/thread-check-eds.sh, in an image with an instrumented
# GLib and EDS. Both scripts run the same way locally. Not on every push: they
# need a nightly toolchain and an instrumented standard library.
# Dispatch by hand with: gh workflow run thread-check.yml

name: Thread check

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  thread-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ci/install-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: thread-check
          workspaces: rust -> ../build/thread-check-target
      - run: ci/thread-check.sh

  # The job builds the image on each run (about 15 minutes). A cache does not
  # help: GitHub removes a cache entry after 7 days without access, and the
  # job runs every 7 days. The hosted runner has rootless podman.
  thread-check-eds:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: >-
          podman build --security-opt seccomp=unconfined
          -f ci/Containerfile.tsan -t evolution-jmap-tsan ci
      # The image of the build stage holds its compilers and the staged files.
      # Remove it to give the test build more disk space.
      - run: podman image prune --force && df -h /
      - run: ci/thread-check-eds.sh
