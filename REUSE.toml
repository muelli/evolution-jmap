version = 1
SPDX-PackageName = "evolution-jmap"
SPDX-PackageDownloadLocation = "https://github.com/muelli/evolution-jmap"

# The C example module and its CMake plumbing come from the GNOME Evolution
# wiki (example-module.zip) and are Red Hat copyright, LGPL. The Rust crate in
# rust/crates/example-module is a port of those files and stays under the same
# license. Files are annotated here instead of editing third-party sources.
[[annotations]]
path = [
    "src/**",
    "CMakeLists.txt",
    "cmake_uninstall.cmake.in",
    "rust/crates/example-module/**",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "2016 Red Hat, Inc. (www.redhat.com)",
    "2026 Tobias Mueller <muelli@cryptobitch.de>",
]
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Machine-generated, trivial, or plain-prose files that do not carry
# comment headers.
[[annotations]]
path = [
    "rust/Cargo.lock",
    ".gitignore",
    "rust/crates/*/tests/fixtures/**",
    # Camel reads every line of a `.urls` file as a protocol name, so a comment
    # header in it would register a provider called "# SPDX-...".
    "rust/crates/jmap-mail/libcameljmap.urls",
    "README.md",
    "docs/**",
    # Written by xgettext, which puts its own boilerplate at the top of the
    # file and would have the header rewritten on every regeneration.
    "po/evolution-jmap.pot",
    "infra/night-shift/*.md",
    "infra/agy-night-shift/*.md",
    # debian/control, /rules and /watch carry their own "#"-comment SPDX
    # headers already, but reuse's comment-style lookup is by filename/
    # extension and none of these extensionless Debian-packaging names are
    # in its recognized list; debian/changelog and debian/copyright are
    # symlinks to already-annotated docs/packaging/* files under a path of
    # their own; debian/source/format's content is fixed by dpkg-source's
    # own format ("3.0 (quilt)"), leaving no room for a comment at all.
    "debian/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tobias Mueller <muelli@cryptobitch.de>"
SPDX-License-Identifier = "GPL-3.0-or-later"
