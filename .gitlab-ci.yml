#
# GitLab CI: a thin wrapper around the same ci/ scripts GitHub runs, so
# the two platforms share one definition of the build and cannot drift.
# This is the self-sufficiency path — if GitHub ever becomes unwelcome,
# a GitLab mirror runs the identical gate with no code changes.

default:
  image: docker.io/library/rust:1.97.1@sha256:3382bd20aa942806c533e9a73cd000474fb3ef173f71e684cc9b942675781769
  interruptible: true

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

.cargo-cache: &cargo-cache
  key:
    files: [rust/Cargo.lock]
  paths:
    - .cargo/registry/index
    - .cargo/registry/cache
    - .cargo/bin
    - rust/target
  policy: pull-push

stages: [check, build, verify]

# fmt + clippy + test + cargo-deny + reuse, all via ci/checks.sh (it
# bootstraps cargo-deny and reuse if missing).
checks:
  stage: check
  cache:
    <<: *cargo-cache
    key:
      files: [rust/Cargo.lock]
      prefix: checks
  before_script:
    - apt-get update -q && apt-get install -y --no-install-recommends pipx
  script:
    - ci/checks.sh

build:
  stage: build
  variables:
    RUNNER_GENERATE_ARTIFACTS_METADATA: "true"  # SLSA provenance for artifacts
  cache:
    <<: *cargo-cache
    key:
      files: [rust/Cargo.lock]
      prefix: build
  script:
    - ci/install-deps.sh
    - ci/build.sh
  artifacts:
    paths:
      - build/cargo-target/release/jmap-mockd
      - build/cargo-target/release/*.so

reproducible:
  stage: verify
  cache: []
  script:
    - ci/reproducible.sh

# GitHub's rpm job runs ci/rpm.sh under podman; here the job itself runs in
# the same pinned Fedora image, so ci/rpm.sh builds and lints on the host.
rpm:
  stage: build
  image: docker.io/library/fedora@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
  cache: []
  script:
    - ci/install-deps-rpm.sh
    - ci/rpm.sh --host
